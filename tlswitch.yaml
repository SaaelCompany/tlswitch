# Порт 80: в hosts нельзя указать порт, браузер открывает http://имя-сайта.
listen: "0.0.0.0:80"

# Свой обычный сертификат (Let's Encrypt или корпоративный), не сертификат Минцифры.
# Включайте, если порт смотрит в интернет: иначе пароли идут открытым HTTP.
# tls_listen: "0.0.0.0:8443"
# tls_cert: "C:\\tlswitch\\fullchain.pem"
# tls_key: "C:\\tlswitch\\privkey.pem"

# Пустые поля — без пароля. Задайте оба, если порт доступен не только из вашей сети.
auth_user: ""
auth_password: ""

# Пусто — пускать любые адреса клиентов. Иначе IP и сети, например 10.0.0.0/8.
# allow_clients:
#   - "192.168.0.0/16"

allow_suffixes:
  - gosuslugi.ru
  - xn--c1aapkosapc.xn--p1ai
  - gu-st.ru
  - nalog.ru
  - nalog.gov.ru
  - government.ru
  - gov.ru
  - rosminzdrav.ru
  - mos.ru
  - cbr.ru
  - rosreestr.ru
  - rosreestr.gov.ru
  - sfr.gov.ru
  - pfr.gov.ru
  - fssp.gov.ru
  - xn--b1aew.xn--p1ai
  - xn--90adear.xn--p1ai

upstream:
  # 1.2 подходит почти всем госсайтам. 1.0 — только если конкретный сайт старше.
  min_tls: "1.2"
  # Публичные DNS, чтобы шлюз не зациклился, если внутренний DNS указывает эти имена на него же.
  dns:
    - "77.88.8.8:53"
    - "8.8.8.8:53"
    - "1.1.1.1:53"
  # Дополнительные PEM, если у сайта свой корневой сертификат.
  ca_file: ""
  # Сертификат организации для ГИС ОМС и других сайтов, которые спрашивают
  # клиентский сертификат ГОСТ. Ключ остаётся на токене.
  # Отпечаток — из certmgr.msc, «Личное» → сертификат → «Состав» → «Отпечаток».
  # PIN — PIN токена. Пустые поля: такой сайт отвечает, что сертификат не подставлен.
  client_thumbprint: ""
  client_pin: ""
  # Запасной путь, если ключ экспортируется в PEM. Не заполняйте вместе с отпечатком.
  # Отпечаток, случайно вставленный в client_cert, тоже принимается. Это не имя файла.
  client_cert: ""
  client_key: ""
  # Исходящий прокси, если серверу так выходят в интернет. Иначе пусто.
  proxy: ""

browser:
  enabled: true
  # Пусто — найти Chrome или Edge самостоятельно.
  path: ""
  # true, если браузер сразу закрывается (часто у службы и в контейнере).
  no_sandbox: false
  max_sessions: 4
  idle_timeout: "20m"
  quality: 70
  max_width: 1600
  max_height: 1200

# Каталог временных профилей браузера. Пусто — папка data рядом с запуском.
data_dir: ""
